<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Registro | GameHub Store
  </title>
  <link href="css/estilos.css" rel="stylesheet"/>
 </head>
 <body>
  <header class="encabezado">
   <div class="contenedor barra-navegacion">
    <a class="marca" href="index.html">
     GameHub
     <span>
      Store
     </span>
    </a>
    <nav aria-label="Navegación principal" class="menu">
     <a href="index.html">
      Inicio
     </a>
     <a href="catalogo.html">
      Productos
     </a>
     <a href="blog.html">
      Blog
     </a>
     <a href="nosotros.html">
      Nosotros
     </a>
     <a href="contacto.html">
      Contacto
     </a>
     <a href="login.html">
      Ingresar
     </a>
     <a href="registro.html">
      Registro
     </a>
     <a href="carrito.html">
      Carrito
      <span class="contador-carrito">
       0
      </span>
     </a>
    </nav>
   </div>
  </header>
  <main>
   <section class="seccion">
    <div class="contenedor">
     <h1>
      Registro de cliente
     </h1>
     <form class="formulario" id="formulario-registro" novalidate="">
      <div class="campo">
       <label for="registro-rut">
        RUN *
       </label>
       <input id="registro-rut" maxlength="9" minlength="7" placeholder="19011022K"/>
       <p class="mensaje" id="error-registro-rut">
       </p>
      </div>
      <div class="campo">
       <label for="registro-nombre">
        Nombre *
       </label>
       <input id="registro-nombre" maxlength="50"/>
       <p class="mensaje" id="error-registro-nombre">
       </p>
      </div>
      <div class="campo">
       <label for="registro-apellidos">
        Apellidos *
       </label>
       <input id="registro-apellidos" maxlength="100"/>
       <p class="mensaje" id="error-registro-apellidos">
       </p>
      </div>
      <div class="campo">
       <label for="registro-correo">
        Correo *
       </label>
       <input id="registro-correo" maxlength="100" type="email"/>
       <p class="mensaje" id="error-registro-correo">
       </p>
      </div>
      <div class="campo">
       <label for="registro-clave">
        Contraseña *
       </label>
       <input
        autocomplete="new-password"
        id="registro-clave"
        maxlength="10"
        minlength="4"
        type="password"
       />
       <p class="ayuda">
        Debe tener entre 4 y 10 caracteres.
       </p>
       <p class="mensaje" id="error-registro-clave">
       </p>
      </div>
      <div class="campo">
       <label for="registro-region">
        Región *
       </label>
       <select id="registro-region">
        <option value="">
         Selecciona una región
        </option>
       </select>
       <p class="mensaje" id="error-registro-region">
       </p>
      </div>
      <div class="campo">
       <label for="registro-comuna">
        Comuna *
       </label>
       <select disabled="" id="registro-comuna">
        <option value="">
         Selecciona una comuna
        </option>
       </select>
       <p class="mensaje" id="error-registro-comuna">
       </p>
      </div>
      <div class="campo">
       <label for="registro-direccion">
        Dirección *
       </label>
       <textarea id="registro-direccion" maxlength="300">
                    </textarea>
       <p class="mensaje" id="error-registro-direccion">
       </p>
      </div>
      <button class="boton" type="submit">
       Registrarme
      </button>
      <p class="mensaje" id="resultado-registro">
      </p>
     </form>
    </div>
   </section>
  </main>
  <a aria-label="Contactar por WhatsApp" class="boton-whatsapp" 
        href="https://wa.me/56912345678?text=Hola%20GameHub%20Store" rel="noopener" target="_blank">
   WhatsApp
  </a>
  <footer class="pie">
   <div class="contenedor">
    <p>
     GameHub Store · Proyecto académico DSY1104 · 2026
    </p>
    <p>
     <a href="admin/index.html">
      Administración
     </a>
    </p>
   </div>
  </footer>
  <script src="js/datos.js">
  </script>
  <script src="js/comun.js">
  </script>
  <script src="js/formularios.js">
  </script>
 </body>
</html>
