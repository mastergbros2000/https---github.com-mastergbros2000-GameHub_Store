<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Productos | GameHub Store
  </title>
  <link href="css/estilos.css" rel="stylesheet"/>
 </head>
 <body>
  <header class="encabezado">
   <div class="contenedor barra-navegacion">
    <a class="marca" href="index.html">
     GameHub
     <span>
      Store
     </span>
    </a>
    <nav aria-label="Navegación principal" class="menu">
     <a href="index.html">
      Inicio
     </a>
     <a href="catalogo.html">
      Productos
     </a>
     <a href="blog.html">
      Blog
     </a>
     <a href="nosotros.html">
      Nosotros
     </a>
     <a href="contacto.html">
      Contacto
     </a>
     <a href="login.html">
      Ingresar
     </a>
     <a href="registro.html">
      Registro
     </a>
     <a href="carrito.html">
      Carrito
      <span class="contador-carrito">
       0
      </span>
     </a>
    </nav>
   </div>
  </header>
  <main>
   <section class="seccion">
    <div class="contenedor">
     <h1>
      Catálogo de productos
     </h1>
     <form class="filtros" id="formulario-filtros">
      <select id="categoria">
       <option value="">
        Todas las categorías
       </option>
       <option>
        Notebooks
       </option>
       <option>
        Periféricos
       </option>
       <option>
        Componentes
       </option>
       <option>
        Monitores
       </option>
       <option>
        Consolas
       </option>
       <option>
        Computadores
       </option>
      </select>
      <select id="marca">
       <option value="">
        Todas las marcas
       </option>
       <option>
        ASUS
       </option>
       <option>
        HP
       </option>
       <option>
        MSI
       </option>
       <option>
        Redragon
       </option>
       <option>
        Master-G
       </option>
       <option>
        Nintendo
       </option>
       <option>
        Sony
       </option>
       <option>
        Gigabyte
       </option>
       <option>
        JBL
       </option>
      </select>
      <input id="precio-minimo" min="0" placeholder="Precio mínimo" type="number"/>
      <input id="precio-maximo" min="0" placeholder="Precio máximo" type="number"/>
      <select id="orden">
       <option value="">
        Sin ordenar
       </option>
       <option value="precio-menor">
        Menor precio
       </option>
       <option value="precio-mayor">
        Mayor precio
       </option>
       <option value="nombre">
        Nombre
       </option>
      </select>
      <button class="boton" type="submit">
       Filtrar
      </button>
      <button class="boton boton-secundario" type="reset">
       Limpiar
      </button>
     </form>
     <p class="mensaje" id="error-precio">
     </p>
     <div class="grilla-productos" id="lista-productos">
     </div>
    </div>
   </section>
  </main>
  <a aria-label="Contactar por WhatsApp" class="boton-whatsapp" 
        href="https://wa.me/56912345678?text=Hola%20GameHub%20Store" rel="noopener" target="_blank">
   WhatsApp
  </a>
  <footer class="pie">
   <div class="contenedor">
    <p>
     GameHub Store · Proyecto académico DSY1104 · 2026
    </p>
    <p>
     <a href="admin/index.html">
      Administración
     </a>
    </p>
   </div>
  </footer>
  <script src="js/datos.js">
  </script>
  <script src="js/comun.js">
  </script>
  <script src="js/tienda.js">
  </script>
 </body>
</html>
