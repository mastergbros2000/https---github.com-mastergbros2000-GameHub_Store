<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Finalizar compra | GameHub Store
  </title>
  <link href="css/estilos.css" rel="stylesheet"/>
 </head>
 <body>
  <header class="encabezado">
   <div class="contenedor barra-navegacion">
    <a class="marca" href="index.html">
     GameHub
     <span>
      Store
     </span>
    </a>
    <nav aria-label="Navegación principal" class="menu">
     <a href="index.html">
      Inicio
     </a>
     <a href="catalogo.html">
      Productos
     </a>
     <a href="blog.html">
      Blog
     </a>
     <a href="nosotros.html">
      Nosotros
     </a>
     <a href="contacto.html">
      Contacto
     </a>
     <a href="login.html">
      Ingresar
     </a>
     <a href="registro.html">
      Registro
     </a>
     <a href="carrito.html">
      Carrito
      <span class="contador-carrito">
       0
      </span>
     </a>
    </nav>
   </div>
  </header>
  <main>
   <section class="seccion">
    <div class="contenedor">
     <h1>
      Finalizar compra
     </h1>
     <form class="formulario" id="formulario-checkout" novalidate="">
      <div class="campo">
       <label for="checkout-nombre">
        Nombre completo *
       </label>
       <input id="checkout-nombre" maxlength="100"/>
       <p class="mensaje" id="error-checkout-nombre">
       </p>
      </div>
      <div class="campo">
       <label for="checkout-correo">
        Correo *
       </label>
       <input id="checkout-correo" maxlength="100" type="email"/>
       <p class="mensaje" id="error-checkout-correo">
       </p>
      </div>
      <div class="campo">
       <label for="checkout-region">
        Región *
       </label>
       <select id="checkout-region">
        <option value="">
         Selecciona una región
        </option>
       </select>
       <p class="mensaje" id="error-checkout-region">
       </p>
      </div>
      <div class="campo">
       <label for="checkout-comuna">
        Comuna *
       </label>
       <select disabled="" id="checkout-comuna">
        <option value="">
         Selecciona una comuna
        </option>
       </select>
       <p class="mensaje" id="error-checkout-comuna">
       </p>
      </div>
      <div class="campo">
       <label for="checkout-direccion">
        Dirección *
       </label>
       <textarea id="checkout-direccion" maxlength="300">
                    </textarea>
       <p class="mensaje" id="error-checkout-direccion">
       </p>
      </div>
      <button class="boton" type="submit">
       Confirmar compra
      </button>
      <p class="mensaje" id="resultado-checkout">
      </p>
     </form>
    </div>
   </section>
  </main>
  <a aria-label="Contactar por WhatsApp" class="boton-whatsapp" 
        href="https://wa.me/56912345678?text=Hola%20GameHub%20Store" rel="noopener" target="_blank">
   WhatsApp
  </a>
  <footer class="pie">
   <div class="contenedor">
    <p>
     GameHub Store · Proyecto académico DSY1104 · 2026
    </p>
    <p>
     <a href="admin/index.html">
      Administración
     </a>
    </p>
   </div>
  </footer>
  <script src="js/datos.js">
  </script>
  <script src="js/comun.js">
  </script>
  <script src="js/tienda.js">
  </script>
  <script src="js/formularios.js">
  </script>
 </body>
</html>
