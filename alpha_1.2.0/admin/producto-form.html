<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Agregar producto | Administración GameHub
  </title>
  <link href="../css/estilos.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="administracion">
   <aside class="menu-admin">
    <h2>
     GameHub Admin
    </h2>
    <nav>
     <a href="index.html">
      Inicio
     </a>
     <a href="productos.html">
      Productos
     </a>
     <a href="producto-form.html">
      Agregar producto
     </a>
     <a href="usuarios.html">
      Usuarios
     </a>
     <a href="usuario-form.html">
      Agregar usuario
     </a>
     <a href="../index.html">
      Volver a la tienda
     </a>
    </nav>
   </aside>
   <main class="contenido-admin">
    <h1>
     Agregar producto
    </h1>
    <form class="formulario" id="formulario-producto-admin" novalidate="">
     <div class="campo">
      <label for="producto-codigo">
       Código *
      </label>
      <input id="producto-codigo" minlength="3"/>
      <p class="mensaje" id="error-producto-codigo">
      </p>
     </div>
     <div class="campo">
      <label for="producto-nombre">
       Nombre *
      </label>
      <input id="producto-nombre" maxlength="100"/>
      <p class="mensaje" id="error-producto-nombre">
      </p>
     </div>
     <div class="campo">
      <label for="producto-descripcion">
       Descripción
      </label>
      <textarea id="producto-descripcion" maxlength="500">
                        </textarea>
      <p class="mensaje" id="error-producto-descripcion">
      </p>
     </div>
     <div class="campo">
      <label for="producto-precio">
       Precio *
      </label>
      <input id="producto-precio" min="0" step="0.01" type="number"/>
      <p class="mensaje" id="error-producto-precio">
      </p>
     </div>
     <div class="campo">
      <label for="producto-stock">
       Stock *
      </label>
      <input id="producto-stock" min="0" step="1" type="number"/>
      <p class="mensaje" id="error-producto-stock">
      </p>
     </div>
     <div class="campo">
      <label for="producto-critico">
       Stock crítico
      </label>
      <input id="producto-critico" min="0" step="1" type="number"/>
      <p class="mensaje" id="error-producto-critico">
      </p>
     </div>
     <div class="campo">
      <label for="producto-categoria">
       Categoría *
      </label>
      <select id="producto-categoria">
       <option value="">
        Selecciona
       </option>
       <option>
        Notebooks
       </option>
       <option>
        Componentes
       </option>
       <option>
        Periféricos
       </option>
       <option>
        Monitores
       </option>
       <option>
        Consolas
       </option>
       <option>
        Computadores
       </option>
      </select>
      <p class="mensaje" id="error-producto-categoria">
      </p>
     </div>
     <div class="campo">
      <label for="producto-imagen">
       Imagen
      </label>
      <input accept="image/*" id="producto-imagen" type="file"/>
      <p class="ayuda">
       La carga se presenta en el formulario; en EP1 los datos se simulan localmente.
      </p>
     </div>
     <button class="boton" type="submit">
      Guardar producto
     </button>
     <p class="mensaje" id="resultado-producto">
     </p>
    </form>
   </main>
  </div>
  <script src="../js/datos.js">
  </script>
  <script src="../js/comun.js">
  </script>
  <script src="../js/formularios.js">
  </script>
  <script src="../js/admin.js">
  </script>
 </body>
</html>
